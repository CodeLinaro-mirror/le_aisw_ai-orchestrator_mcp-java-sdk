# Disable the embedded web server - this is a client-only application
#spring.main.web-application-type=none
server.port=0
# Disable Spring AI MCP client auto-configuration (we configure the client manually)
spring.ai.mcp.client.enabled=false
#spring.security.oauth2.client.registration.default.client-id=pre-registered-client
#spring.security.oauth2.client.registration.default.client-secret=pre-registered-secret
#spring.security.oauth2.client.provider.default.issuer-uri=https://accounts.google.com

logging.level.org.springaicommunity.mcp.security=DEBUG
logging.level.io.modelcontextprotocol.conformance=DEBUG
logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.security=TRACE
